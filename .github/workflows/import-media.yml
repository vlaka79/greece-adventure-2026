name: Import media
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-media.yml"
      - "fetch_media.sh"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch photos and intro video
        run: sh fetch_media.sh
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intro.mp4 intro.jpg photos/crete.jpg photos/santorini.jpg photos/athens.jpg
          if git diff --staged --quiet; then
            echo "no media changes"
          else
            git commit -m "Add intro video and destination photos"
            git pull --rebase origin main
            git push
          fi
