<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eat & drink — Greece Adventure 2026</title>
  <meta name="theme-color" content="#f4eee4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="https://grove-amber-horizon-mist.grok.me/assets/styles-CM6tjZ7_.css" />
  <script src="/ga.js"></script>
</head>
<body class="bg-bg text-fg">
  <div class="min-h-dvh bg-bg text-fg">
    <header class="border-b border-border/80 bg-bg/90">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
        <a href="/#table" class="text-sm font-semibold text-primary">← Back</a>
        <a href="/" class="text-sm font-semibold text-fg/80">Home</a>
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-5 py-10">
      <p class="text-xs font-semibold uppercase tracking-widest text-primary">Along the way</p>
      <h1 class="mt-2 font-serif text-4xl font-semibold text-fg">Eat & drink</h1>
      <p class="mt-2 text-muted">Every plate and glass worth remembering.</p>
      <p id="eats-page-empty" class="mt-10 hidden rounded-xl bg-surface p-8 text-center text-muted card-shadow">Nothing here yet — check back after the next meal.</p>
      <ul id="eats-page-list" class="mt-8 space-y-6"></ul>
    </main>
    <footer class="border-t border-border bg-bg-warm">
      <div class="mx-auto flex max-w-3xl flex-col gap-1 px-5 py-8 text-sm text-muted">
        <p>Made for friends &amp; family</p>
        <p><a href="/trips.html" class="text-muted no-underline">Past trips</a></p>
      </div>
    </footer>
  </div>
  <script>
  (function () {
    fetch("/eats.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (items) {
        var list = document.getElementById("eats-page-list");
        var empty = document.getElementById("eats-page-empty");
        if (!list) return;
        items = items || [];
        if (!items.length) {
          if (empty) empty.classList.remove("hidden");
          return;
        }
        if (empty) empty.classList.add("hidden");
        items.forEach(function (e) {
          var li = document.createElement("li");
          li.className = "overflow-hidden rounded-xl bg-surface card-shadow";
          var html = "";
          if (e.photo) {
            html += '<img src="' + e.photo + '" alt="" class="aspect-video w-full object-cover" />';
          }
          html += '<div class="p-5">' +
            '<p class="text-xs font-semibold uppercase tracking-widest text-primary">' + (e.place || "Somewhere along the way") + "</p>" +
            '<h2 class="mt-1 font-serif text-2xl font-semibold text-fg">' + (e.dish || "") + "</h2>" +
            (e.note ? '<p class="mt-2 text-base leading-relaxed text-fg/90">' + e.note + "</p>" : "") +
            "</div>";
          li.innerHTML = html;
          list.appendChild(li);
        });
      })
      .catch(function () {});
  })();
  </script>
</body>
</html>
