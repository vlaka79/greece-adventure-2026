<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel & Julia · Trips</title>
  <meta name="description" content="Trips from Daniel and Julia — start with Greece Adventure 2026." />
  <meta name="theme-color" content="#f4eee4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="https://grove-amber-horizon-mist.grok.me/assets/styles-CM6tjZ7_.css" />
  <script src="/ga.js"></script>
</head>
<body class="bg-bg text-fg">
  <div class="min-h-dvh bg-bg text-fg">
    <header class="border-b border-border/80 bg-bg/90">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
        <a href="/" class="text-sm font-semibold text-primary">← Home</a>
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-5 py-10">
      <p class="text-xs font-semibold uppercase tracking-widest text-primary">Daniel &amp; Julia</p>
      <h1 class="mt-2 font-serif text-4xl font-semibold text-fg">Trips</h1>
      <p class="mt-2 text-muted">Places we’ve been, and the one we’re on now.</p>
      <ul id="trips-list" class="mt-8 space-y-6"></ul>
      <p id="trips-later" class="mt-8 hidden text-sm text-muted"></p>
    </main>
    <footer class="border-t border-border bg-bg-warm">
      <div class="mx-auto flex max-w-3xl flex-col gap-1 px-5 py-8 text-sm text-muted">
        <p>Made for friends &amp; family</p>
        <p><a href="/trips.html" class="text-muted no-underline">Past trips</a></p>
      </div>
    </footer>
  </div>
  <script>
  (function () {
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    fetch("/trips.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : { trips: [] }; })
      .then(function (data) {
        var list = document.getElementById("trips-list");
        var later = document.getElementById("trips-later");
        if (!list) return;
        var trips = (data && data.trips) || [];
        trips.forEach(function (t) {
          if (!t || !t.href) return;
          var li = document.createElement("li");
          li.innerHTML =
            '<a href="' + esc(t.href) + '" class="block overflow-hidden rounded-xl bg-surface p-5 text-fg no-underline card-shadow">' +
            '<p class="text-xs font-semibold uppercase tracking-widest text-primary">' + esc(t.dates || "") + "</p>" +
            '<h2 class="mt-1 font-serif text-2xl font-semibold text-fg">' + esc(t.title || "") + "</h2>" +
            (t.note ? '<p class="mt-2 text-base leading-relaxed text-muted">' + esc(t.note) + "</p>" : "") +
            "</a>";
          list.appendChild(li);
        });
        if (later && data && data.comingLater) {
          later.textContent = data.comingLater;
          later.classList.remove("hidden");
        }
      })
      .catch(function () {});
  })();
  </script>
</body>
</html>
