<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos — Greece Adventure 2026</title>
  <meta name="theme-color" content="#f4eee4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="https://grove-amber-horizon-mist.grok.me/assets/styles-CM6tjZ7_.css" />
  <style>
    .photo-new-badge {
      position: absolute; top: 0.65rem; left: 0.65rem; z-index: 2;
      border-radius: 999px; background: #1b6f66; color: #f4eee4;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0.28rem 0.55rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .place-chip-sticky {
      position: sticky;
      /* sits under sticky header (~57px + safe-area already on header) */
      top: calc(57px + env(safe-area-inset-top, 0px));
      z-index: 20;
      margin: 0.75rem -1.25rem 0;
      padding: 0.45rem 1.25rem 0.55rem;
      background: #f4eee4;
      border-bottom: 1px solid rgba(28,25,23,0.08);
    }
    /* Stick under the page header: header is in-flow; chips stick below it.
       On iOS, extra safe-area padding on the chip bar. */
    .place-chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0.15rem 0 0.2rem;
    }
    .place-chips::-webkit-scrollbar { display: none; }
    .place-chip {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 0.95rem;
      border-radius: 999px;
      border: 1px solid #cfc6b6;
      background: #fffcf6;
      color: #1c1917;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .place-chip[aria-pressed="true"] {
      background: #1b6f66;
      border-color: #1b6f66;
      color: #f4eee4;
    }
    .place-day-head {
      margin: 1.25rem 0 0.65rem;
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: #1c1917;
    }
    .place-day-head:first-child { margin-top: 0.35rem; }
    .place-day-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    @media (min-width: 640px) {
      .place-day-grid { grid-template-columns: 1fr 1fr; }
    }
    #place-album { display: block; }
    #place-day-banner[hidden], #place-chip-bar[hidden] { display: none !important; }
  </style>
  <script src="/ga.js"></script>
</head>
<body class="bg-bg text-fg">
  <div class="min-h-dvh bg-bg text-fg">
    <header class="sticky top-0 z-30 border-b border-border/80 bg-bg/90" style="padding-top: env(safe-area-inset-top);">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
        <a href="/#photos" class="text-sm font-semibold text-primary">← All places</a>
        <a href="/" class="text-sm font-semibold text-fg/80">Home</a>
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-5 py-10">
      <p class="text-xs font-semibold uppercase tracking-widest text-primary">Photos</p>
      <h1 id="place-title" class="mt-2 font-serif text-4xl font-semibold text-fg">Crete</h1>
      <p id="place-lead" class="mt-2 text-muted">Shots from this stop.</p>
      <div id="place-chip-bar" class="place-chip-sticky" hidden>
        <div id="place-chips" class="place-chips" role="tablist" aria-label="Filter by date"></div>
      </div>
      <h2 id="place-day-banner" class="place-day-head" hidden></h2>
      <p id="place-empty" class="mt-10 hidden rounded-xl bg-surface p-8 text-center text-muted card-shadow">Coming soon — we’ll add pictures here as we go.</p>
      <div id="place-album" class="mt-6"></div>
    </main>
    <footer class="border-t border-border bg-bg-warm">
      <div class="mx-auto px-5 py-8 text-sm text-muted">Made for friends & family</div>
    </footer>
  </div>
  <style>
    #lb-prev, #lb-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 11; min-width: 44px; min-height: 44px; padding: 0;
      border: 0; border-radius: 999px; background: rgba(244,238,228,0.94);
      color: #1c1917; font-size: 28px; line-height: 1; cursor: pointer;
    }
    #lb-prev { left: 8px; }
    #lb-next { right: 8px; }
    #lb-prev[hidden], #lb-next[hidden] { display: none !important; }
  </style>
  <div id="lb" class="fixed inset-0 z-50 hidden items-center justify-center bg-fg/80 p-4" role="dialog" aria-modal="true">
    <button type="button" id="lb-close" class="absolute right-4 top-3 z-10 text-4xl leading-none text-surface" aria-label="Close">×</button>
    <button type="button" id="lb-prev" hidden aria-label="Previous">‹</button>
    <button type="button" id="lb-next" hidden aria-label="Next">›</button>
    <figure class="flex max-h-[90dvh] max-w-full flex-col items-center">
      <img id="lb-img" alt="" class="max-h-[78dvh] max-w-full rounded-xl" />
      <figcaption id="lb-caption" class="mt-3 text-center text-sm text-surface"></figcaption>
      <p id="lb-count" class="mt-1 text-xs text-surface/80"></p>
    </figure>
  </div>
  <script src="/lightbox.js"></script>
  <script src="/place.js"></script>
</body>
</html>
